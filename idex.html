<!DOCTYPE html>


<!-- dentro da tag html fica todo meu sistema web ( site)-->
<html lang="pt-br">

<!--head ( cabeça ) configurações gerais do meu site-->

<head>
    <!-- padrão de caracteres-->
    <meta charset="UTF-8">

    <!--compatível  com celulares e computadores-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <!--Título-->
    <title>Document</title>
</head>

<!--É tudo que enxergo no site-->

<body>
    <p class="nome">Lucia</p>
    <img class="personagem" src="img/lucia.png">

    <div class="textos">

        <p class="etiqueta">Selecione o seu personagem</p>
        <h1>Não é só <br> um jogo.</h1>
        <p class="texto-apoio">Escolha uma lenda dev city. ou tire uma selfie e vire uma</p>

    </div>

    <div class="menu">

        <!--onclick o que deve acontecer quando eu clico -->

        <img class="avatar" src="img/lucia.png">



        <img onclick="escolherpersonagem()" class="avatar" src="img/jason.png">



        <img class="avatar" src="img/cj.png">



        <button class="voce">📸</button>

    </div>

</body>
<script src="scripts.js"> 

</script>

</html>
